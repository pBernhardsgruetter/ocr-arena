[project]
name = "ocr-arena"
version = "0.1.0"
description = "Benchmark arena for OCR engines on scanned documents"
requires-python = ">=3.11"
dependencies = [
  "pymupdf", "pillow", "numpy", "opencv-python-headless", "rapidfuzz",
  "jinja2", "httpx", "liteparse", "pytest",
]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
